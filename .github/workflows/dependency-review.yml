# Fails a pull request that introduces a dependency with a known vulnerability.
#
# This only runs on `pull_request`: the action compares the dependency graph of the base commit
# with the head commit, which is exactly what a pull request provides.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed to write the summary comment on the pull request.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Pinned to the v5.0.0 commit rather than a floating `v5`: actions/dependency-review-action
      # publishes `v5.0.0` but never published a `v5` tag, so `@v5` fails to resolve and the job
      # dies before it checks anything.
      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # fail-on-severity defaults to `low`. This repository fails on high and critical only,
          # so a low-severity advisory in a transitive test dependency does not block work.
          fail-on-severity: high
          # Only report on the pull request when the check actually failed.
          comment-summary-in-pr: on-failure
