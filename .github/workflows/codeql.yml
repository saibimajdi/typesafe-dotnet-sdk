# Static analysis with CodeQL.
#
# `build-mode: manual` compiles the solution ourselves, which is the most precise extraction
# mode for C#. If pull-request latency ever matters more than precision, switch it to
# `build-mode: none` (supported for C#) and drop the restore and build steps — some alerts are
# not detected in that mode.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 04:23 UTC. Offset from the hour so it does not queue behind the
    # top-of-hour cron stampede.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  analyze:
    name: analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Required to upload the SARIF results to code scanning.
      security-events: write
      # Required to fetch CodeQL packs.
      packages: read
      # Required to read workflow run metadata. Harmless on a public repository, required on a
      # private one.
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        run: dotnet restore TypeSafe.slnx

      - name: Build
        run: dotnet build TypeSafe.slnx -c Release --no-restore

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
